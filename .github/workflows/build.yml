name: Build

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
      - '.github/project.yml'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
      - '.github/project.yml'

defaults:
  run:
    shell: bash
    
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false
        if: startsWith(matrix.os, 'windows')

      - uses: actions/checkout@v5

      # Use Mandrel instead of GraalVM CE: a native-image fix needed by POI was
      # backported to Mandrel 25 but not to GraalVM 25.0
      - name: Set up Mandrel 25
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: 'mandrel'
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'
          
      - name: Build with Maven
        run: mvn -B clean verify -Dno-format

      - name: Build with Maven (Native)
        run: mvn -B verify -Dnative -Dnative.surefire.skip
        if: ${{ startsWith(matrix.os, 'windows') == false}}
